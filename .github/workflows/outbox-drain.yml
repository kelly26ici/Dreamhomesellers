name: Outbox Drain & Keep-Alive

# ADR-005 requires the transactional outbox to be drained by a worker.
# Render cron jobs are paid-tier, so this scheduled workflow pings the
# internal consumer endpoint on the deployed site every 5 minutes instead.
# The endpoint is protected by the x-outbox-secret header (value of OUTBOX_CONSUMER_SECRET); the value
# lives in GitHub Actions secrets -- never in this file.
#
# The keep-alive step pings Simon's health endpoint on the same cadence so
# that Render's free-tier idle timeout (15 min) never fires. Both services
# are hit in the same workflow run to avoid burning extra Actions minutes.

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the outbox consumer
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CONSUMER_SECRET: ${{ secrets.OUTBOX_CONSUMER_SECRET }}
        run: |
          code=$(curl -s -o /tmp/outbox-resp.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-outbox-secret: $CONSUMER_SECRET" \
            "$SITE_URL/api/internal/outbox")
          echo "HTTP $code"
          cat /tmp/outbox-resp.txt
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::error::outbox consumer returned HTTP $code"
            exit 1
          fi

      - name: Keep Simon alive
        env:
          SIMON_URL: ${{ secrets.SIMON_API_URL }}
        run: |
          if [ -z "$SIMON_URL" ]; then
            echo "::warning::SIMON_API_URL secret not set — skipping keep-alive"
            exit 0
          fi
          code=$(curl -s -o /tmp/simon-health.txt -w "%{http_code}" \
            --max-time 90 \
            "$SIMON_URL/api/health")
          echo "Simon health: HTTP $code"
          cat /tmp/simon-health.txt
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::Simon health returned HTTP $code (may be cold-starting)"
          fi
