name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders: the app must typecheck/build without real
      # Supabase credentials (production secrets never enter CI — the
      # security doc's launch checklist requires CI to be secret-clean).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # The npm test:* suites hit live Supabase via SUPABASE_ACCESS_TOKEN and
  # intentionally do NOT run here. They require a dev-branch project; see
  # audit-findings/plans-compliance.md finding 4.
