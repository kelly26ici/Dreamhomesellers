name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders: the app must typecheck/build without real
      # Supabase credentials (production secrets never enter CI).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts (which declares the global PageProps/LayoutProps types)
      # is generated by `next build` and gitignored, so the typecheck step
      # runs AFTER the build, not before.
      - name: Build (generates global types)
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      # The palette gate. Every foreground/background pair that can actually
      # occur, in both themes, against WCAG 2.1 AA. A palette nobody measures
      # is a palette nobody can trust, and the old one was never measured once.
      - name: Contrast (design tokens)
        run: npm run verify:contrast

      # The token mirror. tokens.ts must keep pointing at real custom
      # properties in both themes, and must not carry a hex of its own.
      - name: Design tokens (mirror)
        run: npm run test:tokens

      # JS-driven motion cannot be reached by the CSS reduced-motion block, so
      # every file that imports a motion library must ask the question.
      - name: Reduced motion (JS-driven animation)
        run: npm run verify:motion

  # The npm test:* suites hit live Supabase via SUPABASE_ACCESS_TOKEN and
  # intentionally do NOT run here. They require a dev-branch project; see
  # audit-findings/plans-compliance.md finding 4.
